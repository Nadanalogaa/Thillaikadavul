version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    # Rebuild from source on every deploy. Without this, Portainer reuses an
    # existing image of the same name and the deploy silently ships old code.
    pull_policy: build
    container_name: nadanaloga-main-app
    restart: always
    # Only Nginx Proxy Manager reaches the app, over nadanaloga-main-network.
    # Bound to localhost so port 3000 is not open to the internet.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database container. DB_HOST (stack env) selects it: nadanaloga-db is the
      # dedicated database created 2026-09-21; nadanaloga-main-postgres is the old one
      # whose files were shared with the dev stack (see deploy/db-stack.yml).
      DATABASE_URL: postgresql://nadanaloga_user:${POSTGRES_PASSWORD}@${DB_HOST:-nadanaloga-main-postgres}:5432/nadanaloga
      SESSION_SECRET: ${SESSION_SECRET}

      # Supabase Configuration
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}

      # Email Configuration (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}

      # Client URL for CORS
      CLIENT_URL: ${CLIENT_URL}

      # Firebase Configuration (for push notifications)
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}

      # Razorpay online payments
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      # true = checkout shows only UPI (Google Pay / PhonePe). Enable UPI on the Razorpay account first.
      RAZORPAY_UPI_ONLY: ${RAZORPAY_UPI_ONLY:-false}

      # WhatsApp admin alerts (Meta Cloud API)
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG}
    volumes:
      # Payment proofs and course icons are written to server/uploads. Without
      # this volume every redeploy of the stack deleted them.
      - app_uploads:/app/server/uploads
    networks:
      - nadanaloga-main-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_uploads:
    name: nadanaloga-uploads

networks:
  nadanaloga-main-network:
    external: true
