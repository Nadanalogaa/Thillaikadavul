<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <!-- Veena: flat illustration in the site's style (replace with a photo at the same path if preferred) -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b4a2b"/><stop offset="1" stop-color="#5c2e17"/>
    </linearGradient>
  </defs>
  <!-- neck -->
  <path d="M60 150 L270 78 L278 94 L68 166 Z" fill="url(#wood)"/>
  <!-- frets -->
  <g stroke="#f3d9a6" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="139" x2="104" y2="151"/><line x1="124" y1="131" x2="128" y2="143"/><line x1="148" y1="123" x2="152" y2="135"/>
    <line x1="172" y1="114" x2="176" y2="126"/><line x1="196" y1="106" x2="200" y2="118"/><line x1="220" y1="98" x2="224" y2="110"/>
  </g>
  <!-- strings -->
  <g stroke="#f7e7c6" stroke-width="1.2">
    <line x1="60" y1="152" x2="270" y2="80"/><line x1="62" y1="158" x2="272" y2="86"/><line x1="64" y1="164" x2="274" y2="92"/>
  </g>
  <!-- main gourd -->
  <ellipse cx="78" cy="168" rx="54" ry="46" fill="url(#wood)"/>
  <ellipse cx="70" cy="160" rx="22" ry="18" fill="#a9623d" opacity="0.55"/>
  <circle cx="84" cy="176" r="10" fill="#3b1c0d"/>
  <!-- bridge -->
  <rect x="88" y="150" width="18" height="6" rx="2" fill="#f3d9a6" transform="rotate(-19 97 153)"/>
  <!-- small resonator -->
  <circle cx="286" cy="76" r="26" fill="url(#wood)"/>
  <circle cx="282" cy="72" r="10" fill="#a9623d" opacity="0.55"/>
  <!-- peg box with yali scroll -->
  <path d="M268 60 C292 38 318 46 320 68 C322 84 306 90 298 84 C292 78 300 68 306 72 C302 60 282 60 274 74 Z" fill="#c98a4b"/>
  <g fill="#3b1c0d"><circle cx="300" cy="56" r="3.5"/><circle cx="310" cy="64" r="3.5"/><circle cx="312" cy="76" r="3.5"/></g>
  <!-- decoration -->
  <g fill="#e9b84a"><circle cx="60" cy="196" r="4"/><circle cx="96" cy="206" r="4"/><circle cx="40" cy="172" r="4"/></g>
</svg>
