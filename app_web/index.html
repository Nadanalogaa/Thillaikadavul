<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nadanaloga">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nadanaloga</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Self-heal: this app no longer uses a service worker (built with
    --pwa-strategy=none). Unregister any old service worker + clear its caches so
    devices that loaded an earlier, broken build stop being served a stale blank
    page. Harmless once nothing is registered.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
    }
    // Remove the loading overlay once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>

  <style>
    body { margin: 0; background: #f9fafb; }
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #4f46e5;
    }
    #app-loading .spinner {
      width: 36px; height: 36px; border: 3px solid #e0e7ff;
      border-top-color: #4f46e5; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown until Flutter renders; Flutter draws over it. Confirms the page is
       loading rather than truly blank. -->
  <div id="app-loading"><div class="spinner"></div><div>Loading Nadanaloga…</div></div>
  <script src="flutter_bootstrap.js" async></script>

  <!-- "Add to Home Screen" hint. iOS has no programmatic install prompt, so on
       iOS Safari (when not already installed) we show a dismissible instruction
       bar. It sits above the Flutter canvas via a high z-index. -->
  <div id="a2hs" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;
       background:#4f46e5;color:#fff;border-radius:14px;padding:12px 14px;
       box-shadow:0 6px 24px rgba(0,0,0,.25);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       align-items:center;gap:10px;">
    <span style="font-size:20px;">📲</span>
    <span id="a2hs-text" style="flex:1;font-size:13px;line-height:1.35;">
      Install the app: tap <b>Share</b> then <b>“Add to Home Screen”</b>.
    </span>
    <button id="a2hs-close" aria-label="Dismiss"
      style="background:transparent;border:0;color:#e0e7ff;font-size:20px;line-height:1;padding:2px 4px;">×</button>
  </div>
  <script>
    (function () {
      var bar = document.getElementById('a2hs');
      var closeBtn = document.getElementById('a2hs-close');
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var dismissed = false;
      try { dismissed = localStorage.getItem('a2hs_dismissed') === '1'; } catch (e) {}

      // Only worth showing on iOS Safari, when not already installed, and only
      // once the app has rendered (so it doesn't sit over the loading spinner).
      if (isIOS && !standalone && !dismissed) {
        window.addEventListener('flutter-first-frame', function () {
          bar.style.display = 'flex';
        });
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          bar.style.display = 'none';
          try { localStorage.setItem('a2hs_dismissed', '1'); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
